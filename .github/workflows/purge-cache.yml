name: Purge Cloudflare Cache

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

jobs:
  purge:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RESPONSE=$(curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}') || { echo "ERROR: fallo la peticion a Cloudflare"; exit 1; }
          echo "$RESPONSE" | jq -e '.success == true and (.errors | length) == 0' >/dev/null || { echo "ERROR: Cloudflare rechazo el purge:"; echo "$RESPONSE"; exit 1; }
          echo "Cache purge completed successfully"
