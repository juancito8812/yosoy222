name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth 2: el guard de versión de caché compara HEAD con HEAD^
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run unit tests
        run: |
          set -o pipefail
          # status se captura con `|| status=$?` y NO con PIPESTATUS: bajo bash -e
          # (el shell de los run: de Actions) un pipeline fallido aborta el paso
          # en esta línea, y las annotations de abajo quedaban inalcanzables
          # (verificado por simulación; hallazgo del code review 27-sep).
          status=0
          node --test --test-reporter=tap tests/*.test.mjs 2>&1 | tee /tmp/tests.log || status=$?
          # grep sale 1 sin matches (caso normal, 0 tests fallidos): se neutraliza
          # con || true para que la captura de annotations no tape el status real.
          grep -E "^not ok" /tmp/tests.log | head -10 | while read -r linea; do
            echo "::error::$linea"
          done || true
          exit $status

      - name: Verify cache version coherence
        run: |
          python3 scripts/verify_versions.py 2>&1 | tee /tmp/verify.log || true
          grep -q "OK: versiones" /tmp/verify.log && exit 0
          # Si llego aqui, fallo: annotation con el detalle
          tail -20 /tmp/verify.log | while IFS= read -r linea; do
            echo "::error::verify_versions: $linea"
          done
          exit 1

      - name: Guard - cache version bump
        run: |
          set -o pipefail
          status=0
          python3 scripts/check_cache_bump.py HEAD^ 2>&1 | tee /tmp/cache_bump.log || status=$?
          grep -E "^(ERROR|  - )" /tmp/cache_bump.log | head -20 | while IFS= read -r linea; do
            echo "::error::$linea"
          done || true
          exit $status

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Los runners ubuntu-latest traen Chrome preinstalado; se verifica y, si
      # falta, se instala. Sin Chrome no hay auditoría.
      - name: Ensure Chrome present
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome encontrado: $(google-chrome --version)"
          else
            echo "Chrome no encontrado: instalando estable"
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable
          fi

      # Se audita el repo servido en local (no producción) para atrapar
      # regresiones ANTES del despliegue. Sin `|| true`: si Lighthouse falla,
      # el job debe fallar aquí y no en la validación con un JSON ausente.
      - name: Serve site locally
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          sleep 2
          curl -sf -o /dev/null http://127.0.0.1:8080/ || { echo "servidor local no respondió"; exit 1; }

      # 3 mediciones y se conserva la mejor: los runners compartidos tienen TBT
      # muy variable (0 ms local vs 400-600 ms en CI) y una sola pasada produce
      # falsos rojos. Un cambio real de rendimiento empeora las 3.
      - name: Run Lighthouse (mobile, mejor de 3)
        run: |
          set -e
          for intento in 1 2 3; do
            echo "::group::Lighthouse intento $intento"
            out=/tmp/lh-run-$intento.json
            for reintento in 1 2 3; do
              if npx -y lighthouse@12 "http://127.0.0.1:8080/" \
                --quiet \
                --chrome-path="$(command -v google-chrome)" \
                --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
                --output=json --output-path="$out" \
                --only-categories=performance,seo,accessibility,best-practices \
                --max-wait-for-load=60000 && [ -s "$out" ]; then break; fi
              rm -f "$out"; sleep 5
            done
            [ -s "$out" ] || { echo "Lighthouse fallo en el intento $intento"; exit 1; }
            echo "::endgroup::"
          done
          python3 - <<'PY'
          import json, shutil
          runs = [json.load(open(f'/tmp/lh-run-{i}.json')) for i in (1, 2, 3)]
          scores = [r['categories']['performance']['score'] for r in runs]
          best = max(range(3), key=lambda i: scores[i])
          print('performance por corrida:', [round(s * 100) for s in scores], '-> se usa', round(scores[best] * 100))
          shutil.copy(f'/tmp/lh-run-{best + 1}.json', '/tmp/lh-report.json')
          PY
          ls -la /tmp/lh-report.json

      # Umbrales en scripts/lighthouse_check.py; baseline y contexto en
      # LIGHTHOUSE_BASELINE.md.
      - name: Upload Lighthouse report (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: /tmp/lh-report.json
          if-no-files-found: ignore

      - name: Validate Lighthouse scores
        run: python3 scripts/lighthouse_check.py /tmp/lh-report.json
